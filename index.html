```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Winter AR Wonderland</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #ui {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #17354b;
      box-shadow: 0 3px 16px #0003;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    #status {
      margin: 7px 0 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      min-height: 44px;
      padding: 10px 6px;
      border: none;
      border-radius: 10px;
      background: #e1f2f7;
      color: #17354b;
      font-size: 15px;
      font-weight: bold;
      touch-action: manipulation;
    }

    button.selected {
      background: #137d91;
      color: white;
    }

    #resetBtn {
      width: 100%;
      margin-top: 8px;
      background: #f0e8e0;
    }

    #hint {
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.4;
      color: #425a68;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>❄️ Winter AR Wonderland</h1>
    <div id="status">Loading AR…</div>

    <div class="buttons">
      <button id="snowmanBtn" class="selected">☃️ Snowman</button>
      <button id="treeBtn">🎄 Pine Tree</button>
    </div>

    <button id="resetBtn">Remove all objects</button>

    <div id="hint">
      Enter AR, slowly scan the floor or a table, and wait for the green ring.
      Tap once to place an object. Each tap adds another.
    </div>
  </div>

  <a-scene
    renderer="alpha: true; antialias: true"
    webxr="optionalFeatures: hit-test"
    xr-mode-ui="XRMode: ar"
    background="transparent: true">

    <a-camera id="camera" position="0 0 0"></a-camera>

    <a-ring
      id="reticle"
      radius-inner="0.075"
      radius-outer="0.105"
      rotation="-90 0 0"
      color="#00ffad"
      material="shader: flat; side: double"
      visible="false">
    </a-ring>

    <a-entity id="placedObjects"></a-entity>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector("a-scene");
      const statusEl = document.querySelector("#status");
      const reticle = document.querySelector("#reticle");
      const placedObjects = document.querySelector("#placedObjects");

      const snowmanBtn = document.querySelector("#snowmanBtn");
      const treeBtn = document.querySelector("#treeBtn");
      const resetBtn = document.querySelector("#resetBtn");

      let selectedObject = "snowman";
      let arSession = null;
      let hitTestSource = null;
      let localSpace = null;
      let latestHitPose = null;
      let sessionGeneration = 0;

      function setStatus(message) {
        statusEl.textContent = message;
      }

      snowmanBtn.addEventListener("click", () => {
        selectedObject = "snowman";
        snowmanBtn.classList.add("selected");
        treeBtn.classList.remove("selected");
        setStatus("Snowman selected. Scan a surface and tap to place.");
      });

      treeBtn.addEventListener("click", () => {
        selectedObject = "tree";
        treeBtn.classList.add("selected");
        snowmanBtn.classList.remove("selected");
        setStatus("Pine tree selected. Scan a surface and tap to place.");
      });

      resetBtn.addEventListener("click", () => {
        while (placedObjects.firstChild) {
          placedObjects.removeChild(placedObjects.firstChild);
        }
        setStatus("All objects removed.");
      });

      // Create a snowman from simple 3D shapes.
      function makeSnowman() {
        const group = document.createElement("a-entity");

        function sphere(x, y, z, radius, color) {
          const el = document.createElement("a-sphere");
          el.setAttribute("position", `${x} ${y} ${z}`);
          el.setAttribute("radius", radius);
          el.setAttribute("color", color);
          el.setAttribute("roughness", "0.9");
          group.appendChild(el);
          return el;
        }

        sphere(0, 0.32, 0, 0.30, "#f7fbff");
        sphere(0, 0.75, 0, 0.22, "#ffffff");
        sphere(0, 1.07, 0, 0.155, "#ffffff");

        sphere(-0.052, 1.09, -0.135, 0.018, "#20242b");
        sphere(0.052, 1.09, -0.135, 0.018, "#20242b");

        const nose = document.createElement("a-cone");
        nose.setAttribute("position", "0 1.055 -0.18");
        nose.setAttribute("radius-bottom", "0.028");
        nose.setAttribute("radius-top", "0.003");
        nose.setAttribute("height", "0.12");
        nose.setAttribute("rotation", "90 0 0");
        nose.setAttribute("color", "#ff8b26");
        group.appendChild(nose);

        const brim = document.createElement("a-cylinder");
        brim.setAttribute("position", "0 1.205 0");
        brim.setAttribute("radius", "0.16");
        brim.setAttribute("height", "0.025");
        brim.setAttribute("color", "#27364b");
        group.appendChild(brim);

        const hat = document.createElement("a-cylinder");
        hat.setAttribute("position", "0 1.28 0");
        hat.setAttribute("radius", "0.105");
        hat.setAttribute("height", "0.13");
        hat.setAttribute("color", "#27364b");
        group.appendChild(hat);

        sphere(0, 0.69, -0.205, 0.022, "#27364b");
        sphere(0, 0.77, -0.207, 0.022, "#27364b");
        sphere(0, 0.85, -0.205, 0.022, "#27364b");

        return group;
      }

      // Create a decorated pine tree.
      function makeTree() {
        const group = document.createElement("a-entity");

        const trunk = document.createElement("a-cylinder");
        trunk.setAttribute("position", "0 0.16 0");
        trunk.setAttribute("radius", "0.075");
        trunk.setAttribute("height", "0.32");
        trunk.setAttribute("color", "#79502e");
        group.appendChild(trunk);

        const tiers = [
          { y: 0.42, radius: 0.38, height: 0.68 },
          { y: 0.75, radius: 0.29, height: 0.62 },
          { y: 1.04, radius: 0.20, height: 0.53 }
        ];

        for (const tier of tiers) {
          const cone = document.createElement("a-cone");
          cone.setAttribute("position", `0 ${tier.y} 0`);
          cone.setAttribute("radius-bottom", tier.radius);
          cone.setAttribute("radius-top", "0.005");
          cone.setAttribute("height", tier.height);
          cone.setAttribute("color", "#167349");
          cone.setAttribute("roughness", "0.9");
          group.appendChild(cone);
        }

        const star = document.createElement("a-sphere");
        star.setAttribute("position", "0 1.34 0");
        star.setAttribute("radius", "0.065");
        star.setAttribute("color", "#ffd54f");
        group.appendChild(star);

        const decorations = [
          [-0.15, 0.45, -0.17, "#d92d42"],
          [0.14, 0.62, -0.18, "#f6d34b"],
          [-0.08, 0.82, -0.20, "#e9f5ff"],
          [0.09, 0.98, -0.13, "#d92d42"]
        ];

        for (const [x, y, z, color] of decorations) {
          const ornament = document.createElement("a-sphere");
          ornament.setAttribute("position", `${x} ${y} ${z}`);
          ornament.setAttribute("radius", "0.035");
          ornament.setAttribute("color", color);
          group.appendChild(ornament);
        }

        return group;
      }

      function placeObject() {
        if (!latestHitPose) {
          setStatus(
            "No detected surface yet. Slowly scan the floor or table, then tap again."
          );
          return;
        }

        const transform = latestHitPose.transform;
        const p = transform.position;
        const q = transform.orientation;

        const object = selectedObject === "snowman"
          ? makeSnowman()
          : makeTree();

        object.object3D.position.set(p.x, p.y, p.z);
        object.object3D.quaternion.set(q.x, q.y, q.z, q.w);

        placedObjects.appendChild(object);

        setStatus(
          (selectedObject === "snowman" ? "☃️ Snowman" : "🎄 Pine tree") +
          " placed! Tap again to place another."
        );
      }

      // Start hit testing after the AR session starts.
      scene.addEventListener("enter-vr", async () => {
        const generation = ++sessionGeneration;

        try {
          arSession = scene.renderer.xr.getSession();

          if (!arSession) {
            setStatus("AR session not found. Exit AR and try again.");
            return;
          }

          hitTestSource = null;
          localSpace = null;
          latestHitPose = null;
          reticle.setAttribute("visible", false);

          setStatus("Starting surface detection…");

          localSpace = await arSession.requestReferenceSpace("local");
          const viewerSpace =
            await arSession.requestReferenceSpace("viewer");

          const source = await arSession.requestHitTestSource({
            space: viewerSpace
          });

          if (generation !== sessionGeneration) {
            source.cancel();
            return;
          }

          hitTestSource = source;
          setStatus("Slowly move your phone to scan the floor or a table.");

          arSession.addEventListener("end", () => {
            if (generation !== sessionGeneration) return;

            sessionGeneration++;
            arSession = null;
            hitTestSource = null;
            localSpace = null;
            latestHitPose = null;

            reticle.setAttribute("visible", false);
            setStatus("AR ended. Tap the AR button to restart.");
          }, { once: true });

          // Use the browser's actual XR animation frames.
          // The frame is valid only while this callback is running.
          const sessionForLoop = arSession;

          sessionForLoop.requestAnimationFrame(function onXRFrame(time, frame) {
            if (sessionForLoop !== arSession) return;

            if (hitTestSource && localSpace) {
              const hits = frame.getHitTestResults(hitTestSource);

              if (hits.length > 0) {
                const pose = hits[0].getPose(localSpace);

                if (pose) {
                  latestHitPose = pose;

                  const p = pose.transform.position;
                  const q = pose.transform.orientation;

                  reticle.object3D.position.set(p.x, p.y, p.z);
                  reticle.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                  reticle.setAttribute("visible", true);
                } else {
                  latestHitPose = null;
                  reticle.setAttribute("visible", false);
                }
              } else {
                latestHitPose = null;
                reticle.setAttribute("visible", false);
              }
            }

            sessionForLoop.requestAnimationFrame(onXRFrame);
          });

          // Taps in immersive AR arrive as XR select events.
          arSession.addEventListener("select", placeObject);

        } catch (error) {
          hitTestSource = null;
          latestHitPose = null;
          reticle.setAttribute("visible", false);
          setStatus("Surface detection error: " + error.message);
        }
      });

      scene.addEventListener("loaded", async () => {
        if (!navigator.xr) {
          setStatus("WebXR unavailable. Please open this page in Chrome on your phone.");
          return;
        }

        try {
          const supported =
            await navigator.xr.isSessionSupported("immersive-ar");

          setStatus(
            supported
              ? "AR supported. Tap the AR button to begin."
              : "Immersive AR is not supported by this browser."
          );
        } catch (error) {
          setStatus("AR support check failed: " + error.message);
        }
      });

      window.addEventListener("unhandledrejection", event => {
        setStatus(
          "Error: " +
          (event.reason?.message || String(event.reason))
        );
      });
    })();
  </script>
</body>
</html>
