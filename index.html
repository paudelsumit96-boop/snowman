
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Wonderland AR</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(#b9e5ff, #f5fbff);
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    a-scene canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .ui {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 420px;
      margin: auto;
      padding: 16px;
      border-radius: 18px;
      color: #17324d;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 28px #315a7730;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    p {
      margin: 6px 0 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      flex: 1;
      min-width: 110px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    button {
      color: white;
      background: #1769aa;
      cursor: pointer;
    }

    button.secondary {
      color: #17324d;
      background: #e3f2ff;
    }

    select {
      color: #17324d;
      background: #e3f2ff;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #35566f;
    }

    .hint {
      position: fixed;
      z-index: 10;
      bottom: 18px;
      left: 12px;
      right: 12px;
      text-align: center;
      color: #17324d;
      font-size: 14px;
      text-shadow: 0 1px white;
      pointer-events: none;
    }

    body.ar-mode .ui {
      background: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>

<body>
  <div class="ui">
    <h1>❄️ Winter Wonderland AR</h1>
    <p>Choose a winter object, start AR, and tap a detected horizontal surface to place it. Every tap creates a new object!</p>

    <div class="controls">
      <select id="objectType" aria-label="Choose object">
        <option value="snowman">⛄ Snowman</option>
        <option value="tree">🎄 Pine tree</option>
        <option value="both">❄️ Snowman + tree</option>
      </select>

      <button id="startAR">Start AR</button>
      <button id="preview" class="secondary">Preview</button>
      <button id="clear" class="secondary">Clear preview</button>
    </div>

    <div id="status">Ready. For AR, use Chrome on a supported Android device over HTTPS.</div>
  </div>

  <div class="hint" id="hint">
    Preview mode: use the buttons to explore the winter scene.
  </div>

  <a-scene
    embedded
    renderer="alpha: true; antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    winter-spawner
  >
    <a-entity id="cameraRig">
      <a-camera
        id="camera"
        position="0 1.6 4"
        look-controls="enabled: true"
      ></a-camera>
    </a-entity>

    <a-entity
      id="previewGround"
      geometry="primitive: plane; width: 20; height: 20"
      rotation="-90 0 0"
      position="0 -0.02 0"
      material="color: #eaf7ff; roughness: 1"
    ></a-entity>

    <a-entity
      id="previewSnowman"
      position="-0.8 0 -2"
    ></a-entity>

    <a-entity
      id="previewTree"
      position="0.8 0 -2"
    ></a-entity>

    <a-entity
      id="placedObjects"
    ></a-entity>

    <a-entity
      id="reticle"
      visible="false"
      geometry="primitive: ring; radiusInner: 0.09; radiusOuter: 0.12"
      rotation="-90 0 0"
      material="color: #00aaff; shader: flat"
    ></a-entity>

    <a-sky color="#b9e5ff"></a-sky>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const previewGround = document.getElementById("previewGround");
    const placedObjects = document.getElementById("placedObjects");
    const reticle = document.getElementById("reticle");

    let arActive = false;
    let hitTestSource = null;
    let viewerSpace = null;
    let localSpace = null;
    let previewMode = true;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function makeEntity(parent, tag, attributes = {}) {
      const el = document.createElement(tag);

      for (const [key, value] of Object.entries(attributes)) {
        el.setAttribute(key, value);
      }

      parent.appendChild(el);
      return el;
    }

    function addSphere(parent, radius, position, color) {
      return makeEntity(parent, "a-sphere", {
        radius,
        position,
        material: `color: ${color}; roughness: 0.9`
      });
    }

    function createSnowman(parent, position = "0 0 0", scale = "1 1 1") {
      const snowman = makeEntity(parent, "a-entity", {
        position,
        scale
      });

      addSphere(snowman, 0.28, "0 0.3 0", "#ffffff");
      addSphere(snowman, 0.21, "0 0.69 0", "#ffffff");
      addSphere(snowman, 0.145, "0 0.96 0", "#ffffff");

      // Eyes
      addSphere(snowman, 0.025, "-0.055 1.00 0.13", "#172b3a");
      addSphere(snowman, 0.025, "0.055 1.00 0.13", "#172b3a");

      // Nose
      makeEntity(snowman, "a-cone", {
        radiusBottom: 0.045,
        radiusTop: 0,
        height: 0.17,
        position: "0 0.94 0.19",
        rotation: "90 0 0",
        material: "color: #ff8c24"
      });

      // Buttons
      addSphere(snowman, 0.025, "0 0.42 0.255", "#263746");
      addSphere(snowman, 0.025, "0 0.30 0.27", "#263746");
      addSphere(snowman, 0.025, "0 0.18 0.25", "#263746");

      // Red scarf
      makeEntity(snowman, "a-torus", {
        radius: 0.17,
        radiusTubular: 0.035,
        position: "0 0.77 0",
        rotation: "90 0 0",
        material: "color: #e63946"
      });

      // Black hat
      makeEntity(snowman, "a-cylinder", {
        radius: 0.15,
        height: 0.045,
        position: "0 1.105 0",
        material: "color: #202b38"
      });

      makeEntity(snowman, "a-cylinder", {
        radius: 0.095,
        height: 0.16,
        position: "0 1.20 0",
        material: "color: #202b38"
      });

      // Arms
      makeEntity(snowman, "a-cylinder", {
        radius: 0.025,
        height: 0.55,
        position: "-0.36 0.56 0",
        rotation: "0 0 65",
        material: "color: #795548"
      });

      makeEntity(snowman, "a-cylinder", {
        radius: 0.025,
        height: 0.55,
        position: "0.36 0.56 0",
        rotation: "0 0 -65",
        material: "color: #795548"
      });

      return snowman;
    }

    function createTree(parent, position = "0 0 0", scale = "1 1 1") {
      const tree = makeEntity(parent, "a-entity", {
        position,
        scale
      });

      makeEntity(tree, "a-cylinder", {
        radius: 0.075,
        height: 0.45,
        position: "0 0.225 0",
        material: "color: #795548"
      });

      makeEntity(tree, "a-cone", {
        radiusBottom: 0.42,
        radiusTop: 0,
        height: 0.65,
        position: "0 0.62 0",
        material: "color: #237a43"
      });

      makeEntity(tree, "a-cone", {
        radiusBottom: 0.33,
        radiusTop: 0,
        height: 0.58,
        position: "0 0.98 0",
        material: "color: #16804a"
      });

      makeEntity(tree, "a-cone", {
        radiusBottom: 0.23,
        radiusTop: 0,
        height: 0.48,
        position: "0 1.29 0",
        material: "color: #0e6840"
      });

      // Decorative ornaments
      const ornaments = [
        [-0.14, 0.60, 0.26, "#ffdf70"],
        [0.17, 0.78, 0.20, "#e63946"],
        [-0.10, 1.02, 0.19, "#ffffff"],
        [0.10, 1.18, 0.15, "#ffdf70"],
        [0, 1.42, 0.12, "#e63946"]
      ];

      for (const [x, y, z, color] of ornaments) {
        addSphere(tree, 0.045, `${x} ${y} ${z}`, color);
      }

      // Star on top
      makeEntity(tree, "a-cone", {
        radiusBottom: 0.12,
        radiusTop: 0,
        height: 0.22,
        position: "0 1.60 0",
        material: "color: #ffdf70; emissive: #665000"
      });

      return tree;
    }

    function createWinterObject(type, parent, position, scale = "1 1 1") {
      if (type === "snowman") {
        return createSnowman(parent, position, scale);
      }

      if (type === "tree") {
        return createTree(parent, position, scale);
      }

      const group = makeEntity(parent, "a-entity", {
        position,
        scale
      });

      createSnowman(group, "-0.28 0 0", "0.65 0.65 0.65");
      createTree(group, "0.32 0 0", "0.65 0.65 0.65");

      return group;
    }

    function clearPlacedObjects() {
      while (placedObjects.firstChild) {
        placedObjects.removeChild(placedObjects.firstChild);
      }
    }

    function selectedObject() {
      return document.getElementById("objectType").value;
    }

    function showPreview() {
      previewMode = true;
      arActive = false;

      document.body.classList.remove("ar-mode");
      previewGround.setAttribute("visible", true);
      reticle.setAttribute("visible", false);

      clearPlacedObjects();

      createWinterObject("snowman", placedObjects, "-0.8 0 -2");
      createWinterObject("tree", placedObjects, "0.8 0 -2");

      document.getElementById("previewSnowman").setAttribute("visible", false);
      document.getElementById("previewTree").setAttribute("visible", false);

      document.getElementById("camera").setAttribute("position", "0 1.6 4");
      document.getElementById("camera").setAttribute("rotation", "0 0 0");

      hintEl.textContent = "Preview mode: look at the winter objects in the scene.";
      setStatus("Preview mode enabled.");
    }

    async function startAR() {
      if (!navigator.xr) {
        setStatus("WebXR is unavailable. Use a supported Android phone with Chrome and HTTPS.");
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported("immersive-ar");

        if (!supported) {
          setStatus("Immersive AR is not supported on this device or browser.");
          return;
        }

        const session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["hit-test"],
          optionalFeatures: ["dom-overlay"],
          domOverlay: { root: document.body }
        });

        await scene.enterVR();

        const renderer = scene.renderer;

        if (!renderer.xr || !renderer.xr.getSession()) {
          setStatus("AR session started, but the rendering session was not detected. Try the AR button in the scene.");
          return;
        }

        arActive = true;
        previewMode = false;
        document.body.classList.add("ar-mode");

        previewGround.setAttribute("visible", false);
        document.getElementById("previewSnowman").setAttribute("visible", false);
        document.getElementById("previewTree").setAttribute("visible", false);

        setStatus("AR started. Move your phone to find a surface, then tap to place objects.");
        hintEl.textContent = "Move your phone slowly to scan a horizontal surface, then tap to place.";

        session.addEventListener("end", () => {
          arActive = false;
          reticle.setAttribute("visible", false);
          document.body.classList.remove("ar-mode");
          setStatus("AR session ended.");
        });

        await initializeHitTest(session);
      } catch (error) {
        console.error(error);
        setStatus("Could not start AR. Check HTTPS, device support, and browser permissions.");
      }
    }

    async function initializeHitTest(session) {
      try {
        const referenceSpace = await session.requestReferenceSpace("local");
        viewerSpace = await session.requestReferenceSpace("viewer");
        localSpace = referenceSpace;

        hitTestSource = await session.requestHitTestSource({
          space: viewerSpace
        });

        session.addEventListener("select", () => {
          placeAtReticle();
        });

        session.addEventListener("end", () => {
          if (hitTestSource) {
            hitTestSource.cancel();
            hitTestSource = null;
          }
        });

        session.requestAnimationFrame(onXRFrame);
      } catch (error) {
        console.error(error);
        setStatus("Hit testing could not start. This device may not support surface detection.");
      }
    }

    function onXRFrame(time, frame) {
      const session = frame.session;

      if (!arActive || !hitTestSource) {
        return;
      }

      session.requestAnimationFrame(onXRFrame);

      const results = frame.getHitTestResults(hitTestSource);

      if (results.length > 0) {
        const hit = results[0];
        const pose = hit.getPose(localSpace);

        if (pose) {
          const position = pose.transform.position;
          const orientation = pose.transform.orientation;

          reticle.setAttribute("visible", true);
          reticle.object3D.position.set(position.x, position.y, position.z);
          reticle.object3D.quaternion.set(
            orientation.x,
            orientation.y,
            orientation.z,
            orientation.w
          );
        }
      } else {
        reticle.setAttribute("visible", false);
      }
    }

    function placeAtReticle() {
      if (!arActive || !reticle.getAttribute("visible")) {
        return;
      }

      const p = reticle.object3D.position;

      // Each tap creates a new entity rather than moving a preloaded model.
      createWinterObject(
        selectedObject(),
        placedObjects,
        `${p.x} ${p.y} ${p.z}`,
        "0.5 0.5 0.5"
      );

      setStatus("Object placed! Tap another detected surface to place another.");
    }

    document.getElementById("startAR").addEventListener("click", startAR);
    document.getElementById("preview").addEventListener("click", showPreview);

    document.getElementById("clear").addEventListener("click", () => {
      clearPlacedObjects();
      setStatus("Placed objects cleared.");
    });

    // Build the desktop preview on page load.
    window.addEventListener("load", () => {
      showPreview();
    });

    // Keep the AR scene transparent so the real camera view is visible.
    scene.addEventListener("loaded", () => {
      if (scene.renderer) {
        scene.renderer.setClearColor(0x000000, 0);
      }
    });
  </script>
</body>
</html>
