<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#dff4ff">
  <title>Winter AR Wonderland</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .header {
      margin: 14px auto 0;
      padding: 12px 16px;
      width: fit-content;
      max-width: 94%;
      text-align: center;
      color: #17364d;
      background: rgba(255,255,255,.91);
      border-radius: 18px;
      box-shadow: 0 3px 16px #0002;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .header p {
      margin: 0;
      font-size: 12px;
    }

    #status {
      margin: 10px auto;
      padding: 9px 13px;
      width: fit-content;
      max-width: 94%;
      text-align: center;
      color: #17364d;
      background: rgba(255,255,255,.92);
      border-radius: 12px;
      font-size: 13px;
    }

    #instructions {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 86px;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      color: #17364d;
      background: rgba(255,255,255,.9);
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    button {
      pointer-events: auto;
      border: 0;
      border-radius: 13px;
      padding: 12px 13px;
      font-weight: bold;
      font-size: 13px;
      color: #17364d;
      background: white;
      box-shadow: 0 3px 12px #0002;
      touch-action: manipulation;
    }

    #snowmanBtn { background: #e4f5ff; }
    #treeBtn { background: #e1f7e5; }
    #clearBtn { background: #fff0e9; }

    .selected {
      outline: 3px solid #46a9dd;
    }

    /* Use A-Frame's AR button, never its VR button. */
    .a-enter-vr { display: none !important; }

    .a-enter-ar {
      position: fixed !important;
      top: 14px !important;
      right: 14px !important;
      left: auto !important;
      bottom: auto !important;
      z-index: 30 !important;
    }

    @media (max-width: 380px) {
      .header h1 { font-size: 18px; }
      button { padding: 11px 9px; font-size: 12px; }
    }
  </style>
</head>

<body>
  <!-- Keep the complete interface inside the WebXR DOM overlay. -->
  <div id="ui">
    <div class="header">
      <h1>❄️ Winter AR Wonderland</h1>
      <p>Bring a little winter magic into your world!</p>
    </div>

    <div id="status">Loading AR support…</div>

    <div id="instructions">
      Tap the AR button. Point your phone at a floor or table.
      When the green ring appears, tap the screen to place an object.
    </div>

    <div id="controls">
      <button id="snowmanBtn" class="selected">☃️ Snowman</button>
      <button id="treeBtn">🎄 Tree</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>
  </div>

  <a-scene
    id="scene"
    renderer="alpha: true; antialias: true"
    background="color: #000000; transparent: true"
    webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #ui"
    xr-mode-ui="XRMode: ar">

    <a-camera id="camera" position="0 0 0"></a-camera>

    <!-- This component tracks detected surfaces. -->
    <a-entity id="reticle" visible="false">
      <a-ring
        radius-inner="0.075"
        radius-outer="0.095"
        rotation="-90 0 0"
        material="shader: flat; color: #35f59b; side: double">
      </a-ring>
    </a-entity>

    <a-entity id="objects"></a-entity>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector("#scene");
      const reticle = document.querySelector("#reticle");
      const objects = document.querySelector("#objects");
      const status = document.querySelector("#status");

      const snowmanBtn = document.querySelector("#snowmanBtn");
      const treeBtn = document.querySelector("#treeBtn");
      const clearBtn = document.querySelector("#clearBtn");

      let selected = "snowman";
      let session = null;
      let hitSource = null;
      let referenceSpace = null;
      let latestPose = null;

      function message(text) {
        status.textContent = text;
      }

      function selectType(type) {
        selected = type;
        snowmanBtn.classList.toggle("selected", type === "snowman");
        treeBtn.classList.toggle("selected", type === "tree");

        message(type === "snowman"
          ? "Snowman selected. Tap a detected surface to place one."
          : "Tree selected. Tap a detected surface to place one.");
      }

      snowmanBtn.addEventListener("click", () => selectType("snowman"));
      treeBtn.addEventListener("click", () => selectType("tree"));

      clearBtn.addEventListener("click", () => {
        objects.replaceChildren();
        message("All objects cleared.");
      });

      function addSphere(parent, position, radius, color) {
        const el = document.createElement("a-sphere");
        el.setAttribute("position", position);
        el.setAttribute("radius", radius);
        el.setAttribute("material", `color: ${color}; roughness: 0.9`);
        parent.appendChild(el);
        return el;
      }

      function addCylinder(parent, position, radius, height, color) {
        const el = document.createElement("a-cylinder");
        el.setAttribute("position", position);
        el.setAttribute("radius", radius);
        el.setAttribute("height", height);
        el.setAttribute("material", `color: ${color}; roughness: 0.9`);
        parent.appendChild(el);
        return el;
      }

      function makeSnowman() {
        const root = document.createElement("a-entity");

        addSphere(root, "0 0.34 0", 0.34, "#ffffff");
        addSphere(root, "0 0.82 0", 0.245, "#ffffff");
        addSphere(root, "0 1.17 0", 0.17, "#ffffff");

        addSphere(root, "-0.06 1.20 0.15", 0.022, "#17212b");
        addSphere(root, "0.06 1.20 0.15", 0.022, "#17212b");

        const nose = document.createElement("a-cone");
        nose.setAttribute("position", "0 1.15 0.20");
        nose.setAttribute("rotation", "90 0 0");
        nose.setAttribute("radius-bottom", "0.035");
        nose.setAttribute("radius-top", "0.002");
        nose.setAttribute("height", "0.15");
        nose.setAttribute("material", "color: #ff8b24");
        root.appendChild(nose);

        [0.70, 0.83, 0.95].forEach(y => {
          addSphere(root, `0 ${y} 0.23`, 0.025, "#263746");
        });

        [-1, 1].forEach(side => {
          const arm = addCylinder(
            root,
            `${side * 0.34} 0.84 0`,
            0.022,
            0.38,
            "#795238"
          );
          arm.setAttribute("rotation", `0 0 ${side * -55}`);
        });

        addCylinder(root, "0 1.34 0", 0.19, 0.045, "#d93643");
        addCylinder(root, "0 1.44 0", 0.12, 0.17, "#d93643");
        addSphere(root, "0 1.54 0", 0.045, "#ffffff");

        return root;
      }

      function makeTree() {
        const root = document.createElement("a-entity");

        addCylinder(root, "0 0.20 0", 0.09, 0.40, "#79502d");

        [
          [0.48, 0.42, 0.72],
          [0.80, 0.34, 0.65],
          [1.10, 0.25, 0.58],
          [1.36, 0.16, 0.45]
        ].forEach(([y, radius, height], i) => {
          const cone = document.createElement("a-cone");
          cone.setAttribute("position", `0 ${y} 0`);
          cone.setAttribute("radius-bottom", radius);
          cone.setAttribute("radius-top", 0.012);
          cone.setAttribute("height", height);
          cone.setAttribute(
            "material",
            `color: ${i % 2 ? "#218c52" : "#167b48"}; roughness: 0.9`
          );
          root.appendChild(cone);
        });

        [
          [-0.18, 0.55, 0.25, "#e53935"],
          [0.17, 0.72, 0.23, "#ffd54f"],
          [-0.12, 0.93, 0.25, "#42a5f5"],
          [0.12, 1.12, 0.19, "#ffca28"],
          [-0.07, 1.28, 0.16, "#ef5350"]
        ].forEach(([x, y, z, color]) => {
          addSphere(root, `${x} ${y} ${z}`, 0.045, color);
        });

        addSphere(root, "0 1.66 0", 0.075, "#ffdc43");

        return root;
      }

      function placeAtPose(pose) {
        const root = selected === "snowman" ? makeSnowman() : makeTree();

        const p = pose.transform.position;
        const q = pose.transform.orientation;

        root.object3D.position.set(p.x, p.y, p.z);
        root.object3D.quaternion.set(q.x, q.y, q.z, q.w);

        objects.appendChild(root);
        message(`${selected === "snowman" ? "Snowman" : "Tree"} placed! Tap again to place another.`);
      }

      async function beginHitTesting(xrSession) {
        session = xrSession;
        hitSource = null;
        latestPose = null;

        try {
          const viewerSpace =
            await session.requestReferenceSpace("viewer");

          hitSource = await session.requestHitTestSource({
            space: viewerSpace
          });

          referenceSpace =
            await session.requestReferenceSpace("local");

          message("Move your phone slowly to scan the floor or table.");

          session.addEventListener("end", () => {
            session = null;
            hitSource = null;
            referenceSpace = null;
            latestPose = null;
            reticle.setAttribute("visible", false);
            message("AR ended. Tap the AR button to start again.");
          }, { once: true });

        } catch (error) {
          console.error("Could not initialise hit testing:", error);
          message("Surface detection failed. Exit AR and try again.");
        }
      }

      /*
       * Use A-Frame's WebXR renderer session.
       * Never call scene.enterVR() or request a second session.
       */
      scene.addEventListener("loaded", () => {
        message("Ready. Tap the AR button in the corner.");

        const xrRenderer = scene.renderer.xr;

        xrRenderer.addEventListener("sessionstart", () => {
          const xrSession = xrRenderer.getSession();

          if (!xrSession) {
            message("Could not access the AR session. Reload and retry.");
            return;
          }

          console.log("XR session mode:", xrSession.environmentBlendMode);
          console.log("XR session features:", xrSession.enabledFeatures);

          if (xrSession.environmentBlendMode === "opaque") {
            message("The session started without camera passthrough. Exit AR and check that you tapped the AR button, not VR.");
          } else {
            message("AR started. Scan a floor or table.");
          }

          beginHitTesting(xrSession);
        });

        xrRenderer.addEventListener("sessionend", () => {
          session = null;
          hitSource = null;
          referenceSpace = null;
          latestPose = null;
          reticle.setAttribute("visible", false);
        });
      });

      /*
       * A-Frame updates scene.frame on every XR animation frame.
       */
      AFRAME.registerComponent("surface-hit-test", {
        tick: function () {
          if (!session || !hitSource || !referenceSpace) return;

          const frame = scene.frame;
          if (!frame) return;

          const results = frame.getHitTestResults(hitSource);

          if (!results.length) {
            latestPose = null;
            reticle.setAttribute("visible", false);
            return;
          }

          const pose = results[0].getPose(referenceSpace);

          if (!pose) return;

          latestPose = pose;

          const p = pose.transform.position;
          const q = pose.transform.orientation;

          reticle.object3D.position.set(p.x, p.y, p.z);
          reticle.object3D.quaternion.set(q.x, q.y, q.z, q.w);
          reticle.setAttribute("visible", true);
        }
      });

      scene.setAttribute("surface-hit-test", "");

      /*
       * The XR select event represents a tap in the immersive AR view.
       */
      scene.addEventListener("loaded", () => {
        scene.renderer.xr.addEventListener("sessionstart", () => {
          const activeSession = scene.renderer.xr.getSession();
          if (!activeSession) return;

          activeSession.addEventListener("select", () => {
            if (!latestPose) {
              message("No surface detected yet. Move the phone slowly.");
              return;
            }

            placeAtPose(latestPose);
          });
        });
      });

      selectType("snowman");
    })();
  </script>
</body>
</html>
