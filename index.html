```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Camera Test</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #message {
      position: fixed;
      z-index: 999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 14px;
      background: white;
      color: #111;
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="message">Loading AR test…</div>

  <a-scene
    renderer="alpha: true; antialias: true"
    webxr="optionalFeatures: hit-test"
    xr-mode-ui="XRMode: ar"
    background="transparent: true">

    <a-box position="0 0 -1" color="#4CC3D9"></a-box>
    <a-camera position="0 0 0"></a-camera>
  </a-scene>

  <script>
    const message = document.querySelector("#message");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", async () => {
      message.textContent = "Ready. Tap the AR button.";

      if (!navigator.xr) {
        message.textContent = "ERROR: WebXR is unavailable in this browser.";
        return;
      }

      try {
        const supported =
          await navigator.xr.isSessionSupported("immersive-ar");

        message.textContent = supported
          ? "AR is supported. Tap the AR button."
          : "ERROR: immersive-ar is not supported.";
      } catch (error) {
        message.textContent = "Support check failed: " + error.message;
      }

      scene.renderer.xr.addEventListener("sessionstart", () => {
        const session = scene.renderer.xr.getSession();
        message.textContent =
          "Session started. Blend mode: " +
          (session?.environmentBlendMode || "unknown");
      });
    });

    window.addEventListener("unhandledrejection", event => {
      message.textContent = "ERROR: " +
        (event.reason?.message || String(event.reason));
    });
  </script>
</body>
</html>
