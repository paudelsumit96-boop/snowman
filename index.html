```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#dff4ff">
  <title>Winter AR Wonderland</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .header {
      width: fit-content;
      max-width: 94%;
      margin: 14px auto 0;
      padding: 12px 16px;
      text-align: center;
      color: #17364d;
      background: rgba(255,255,255,.92);
      border-radius: 18px;
      box-shadow: 0 3px 16px #0002;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .header p {
      margin: 0;
      font-size: 12px;
    }

    #status {
      width: fit-content;
      max-width: 94%;
      margin: 10px auto;
      padding: 9px 13px;
      border-radius: 12px;
      background: rgba(255,255,255,.93);
      color: #17364d;
      text-align: center;
      font-size: 13px;
    }

    #controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    #instructions {
      position: absolute;
      bottom: 82px;
      left: 12px;
      right: 12px;
      padding: 10px;
      text-align: center;
      border-radius: 12px;
      color: #17364d;
      background: rgba(255,255,255,.9);
      font-size: 12px;
    }

    button {
      pointer-events: auto;
      padding: 12px 13px;
      border: 0;
      border-radius: 13px;
      font-size: 13px;
      font-weight: bold;
      color: #17364d;
      background: white;
      box-shadow: 0 3px 12px #0002;
      touch-action: manipulation;
    }

    #snowmanBtn { background: #e4f5ff; }
    #treeBtn { background: #e1f7e5; }
    #clearBtn { background: #fff0e9; }
    button.selected { outline: 3px solid #46a9dd; }

    .a-enter-vr { display: none !important; }

    @media (max-width: 380px) {
      .header h1 { font-size: 18px; }
      button { padding: 11px 9px; font-size: 12px; }
    }
  </style>
</head>

<body>
  <div id="ui">
    <div class="header">
      <h1>❄️ Winter AR Wonderland</h1>
      <p>Bring a little winter magic into your world!</p>
    </div>

    <div id="status">Loading AR support…</div>

    <div id="instructions">
      Tap the AR button. Scan a floor or table until the green ring appears,
      then tap the screen to place an object.
    </div>

    <div id="controls">
      <button id="snowmanBtn" class="selected">☃️ Snowman</button>
      <button id="treeBtn">🎄 Tree</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>
  </div>

  <a-scene
    id="scene"
    renderer="alpha: true; antialias: true"
    webxr="mode: ar; requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #ui; referenceSpaceType: local"
    xr-mode-ui="enabled: true; XRMode: ar"
    vr-mode-ui="enabled: false"
    background="transparent: true">

    <a-entity id="cameraRig">
      <a-camera id="camera" position="0 0 0"></a-camera>
    </a-entity>

    <a-entity id="reticle" visible="false">
      <a-ring
        radius-inner="0.075"
        radius-outer="0.095"
        rotation="-90 0 0"
        material="shader: flat; color: #35f59b; side: double">
      </a-ring>
    </a-entity>

    <a-entity id="objects"></a-entity>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector("#scene");
      const reticle = document.querySelector("#reticle");
      const objects = document.querySelector("#objects");
      const status = document.querySelector("#status");

      const snowmanBtn = document.querySelector("#snowmanBtn");
      const treeBtn = document.querySelector("#treeBtn");
      const clearBtn = document.querySelector("#clearBtn");

      let selected = "snowman";
      let xrSession = null;
      let hitTestSource = null;
      let localSpace = null;
      let latestPose = null;
      let sessionListenerAttached = false;

      function setStatus(text) {
        status.textContent = text;
      }

      function selectType(type) {
        selected = type;
        snowmanBtn.classList.toggle("selected", type === "snowman");
        treeBtn.classList.toggle("selected", type === "tree");

        setStatus(
          type === "snowman"
            ? "Snowman selected. Scan a surface and tap to place."
            : "Tree selected. Scan a surface and tap to place."
        );
      }

      snowmanBtn.addEventListener("click", () => selectType("snowman"));
      treeBtn.addEventListener("click", () => selectType("tree"));

      clearBtn.addEventListener("click", () => {
        objects.replaceChildren();
        setStatus("All objects cleared.");
      });

      function sphere(parent, position, radius, color) {
        const el = document.createElement("a-sphere");
        el.setAttribute("position", position);
        el.setAttribute("radius", radius);
        el.setAttribute("material",
          `color: ${color}; roughness: 0.9`);
        parent.appendChild(el);
        return el;
      }

      function cylinder(parent, position, radius, height, color) {
        const el = document.createElement("a-cylinder");
        el.setAttribute("position", position);
        el.setAttribute("radius", radius);
        el.setAttribute("height", height);
        el.setAttribute("material",
          `color: ${color}; roughness: 0.9`);
        parent.appendChild(el);
        return el;
      }

      function createSnowman() {
        const root = document.createElement("a-entity");

        sphere(root, "0 0.34 0", 0.34, "#ffffff");
        sphere(root, "0 0.82 0", 0.245, "#ffffff");
        sphere(root, "0 1.17 0", 0.17, "#ffffff");

        sphere(root, "-0.06 1.20 0.15", 0.022, "#17212b");
        sphere(root, "0.06 1.20 0.15", 0.022, "#17212b");

        const nose = document.createElement("a-cone");
        nose.setAttribute("position", "0 1.15 0.20");
        nose.setAttribute("rotation", "90 0 0");
        nose.setAttribute("radius-bottom", "0.035");
        nose.setAttribute("radius-top", "0.002");
        nose.setAttribute("height", "0.15");
        nose.setAttribute("material", "color: #ff8b24");
        root.appendChild(nose);

        [0.70, 0.83, 0.95].forEach(y => {
          sphere(root, `0 ${y} 0.23`, 0.025, "#263746");
        });

        [-1, 1].forEach(side => {
          const arm = cylinder(
            root, `${side * 0.34} 0.84 0`,
            0.022, 0.38, "#795238"
          );
          arm.setAttribute("rotation", `0 0 ${side * -55}`);
        });

        cylinder(root, "0 1.34 0", 0.19, 0.045, "#d93643");
        cylinder(root, "0 1.44 0", 0.12, 0.17, "#d93643");
        sphere(root, "0 1.54 0", 0.045, "#ffffff");

        return root;
      }

      function createTree() {
        const root = document.createElement("a-entity");

        cylinder(root, "0 0.20 0", 0.09, 0.40, "#79502d");

        [
          [0.48, 0.42, 0.72],
          [0.80, 0.34, 0.65],
          [1.10, 0.25, 0.58],
          [1.36, 0.16, 0.45]
        ].forEach(([y, radius, height], i) => {
          const cone = document.createElement("a-cone");
          cone.setAttribute("position", `0 ${y} 0`);
          cone.setAttribute("radius-bottom", radius);
          cone.setAttribute("radius-top", 0.012);
          cone.setAttribute("height", height);
          cone.setAttribute(
            "material",
            `color: ${i % 2 ? "#218c52" : "#167b48"}; roughness: 0.9`
          );
          root.appendChild(cone);
        });

        [
          [-0.18, 0.55, 0.25, "#e53935"],
          [0.17, 0.72, 0.23, "#ffd54f"],
          [-0.12, 0.93, 0.25, "#42a5f5"],
          [0.12, 1.12, 0.19, "#ffca28"],
          [-0.07, 1.28, 0.16, "#ef5350"]
        ].forEach(([x, y, z, color]) => {
          sphere(root, `${x} ${y} ${z}`, 0.045, color);
        });

        sphere(root, "0 1.66 0", 0.075, "#ffdc43");
        return root;
      }

      function placeObject(pose) {
        const root = selected === "snowman"
          ? createSnowman()
          : createTree();

        const p = pose.transform.position;
        const q = pose.transform.orientation;

        root.object3D.position.set(p.x, p.y, p.z);
        root.object3D.quaternion.set(q.x, q.y, q.z, q.w);

        objects.appendChild(root);
        setStatus(
          `${selected === "snowman" ? "Snowman" : "Tree"} placed! Tap again to add another.`
        );
      }

      async function initialiseHitTesting(session) {
        try {
          hitTestSource = null;
          latestPose = null;

          const viewerSpace =
            await session.requestReferenceSpace("viewer");

          hitTestSource =
            await session.requestHitTestSource({ space: viewerSpace });

          localSpace =
            await session.requestReferenceSpace("local");

          setStatus("Move your phone slowly to scan the floor or table.");
        } catch (error) {
          console.error("Hit-test initialisation failed:", error);
          setStatus("AR started, but surface detection failed. Check the console.");
        }
      }

      function attachSessionListeners() {
        if (sessionListenerAttached) return;
        sessionListenerAttached = true;

        const xr = scene.renderer.xr;

        xr.addEventListener("sessionstart", () => {
          xrSession = xr.getSession();

          if (!xrSession) {
            setStatus("No active XR session was found.");
            return;
          }

          console.log("XR session started.");
          console.log("Environment blend mode:",
            xrSession.environmentBlendMode);

          if (xrSession.environmentBlendMode === "opaque") {
            setStatus("AR session has no camera passthrough. Check AR mode.");
          } else {
            setStatus("AR started. Move your phone to scan a surface.");
          }

          initialiseHitTesting(xrSession);

          xrSession.addEventListener("end", () => {
            xrSession = null;
            hitTestSource = null;
            localSpace = null;
            latestPose = null;
            reticle.setAttribute("visible", false);
            setStatus("AR ended. Tap the AR button to try again.");
          }, { once: true });

          xrSession.addEventListener("select", () => {
            if (!latestPose) {
              setStatus("No surface detected yet. Scan the floor or table.");
              return;
            }

            placeObject(latestPose);
          });
        });
      }

      /*
       * The hit-test component runs during A-Frame's render loop.
       * scene.frame is populated during XR rendering.
       */
      AFRAME.registerComponent("ar-hit-test", {
        tick: function () {
          if (!xrSession || !hitTestSource || !localSpace) return;

          const frame = scene.frame;
          if (!frame) return;

          const results = frame.getHitTestResults(hitTestSource);

          if (results.length === 0) {
            latestPose = null;
            reticle.setAttribute("visible", false);
            return;
          }

          const pose = results[0].getPose(localSpace);
          if (!pose) return;

          latestPose = pose;

          const p = pose.transform.position;
          const q = pose.transform.orientation;

          reticle.object3D.position.set(p.x, p.y, p.z);
          reticle.object3D.quaternion.set(q.x, q.y, q.z, q.w);
          reticle.setAttribute("visible", true);
        }
      });

      scene.setAttribute("ar-hit-test", "");

      scene.addEventListener("loaded", () => {
        attachSessionListeners();
        setStatus("Ready. Tap the AR button in the corner.");
      });

      scene.addEventListener("renderstart", () => {
        if (scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
        }
      });

      window.addEventListener("error", event => {
        console.error("Page error:", event.message);
        setStatus("JavaScript error: " + event.message);
      });

      window.addEventListener("unhandledrejection", event => {
        console.error("Unhandled error:", event.reason);
        setStatus("AR error: " +
          (event.reason?.message || String(event.reason)));
      });

      selectType("snowman");
    })();
  </script>
</body>
</html>
